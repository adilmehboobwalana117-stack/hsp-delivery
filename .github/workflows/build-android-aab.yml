name: Build HSP delivery Android AAB & APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Public HTTPS URL of HSP delivery (must serve /manifest.webmanifest)'
        required: true
        default: 'https://ais-pre-jjyvyo7m4unbdm4dz4upjq-756142993760.asia-southeast1.run.app'
      package_id:
        description: 'Android Package Name (Application ID)'
        required: true
        default: 'hspdeliverypk.com'
      version_code:
        description: 'Android Version Code (increment for every Play Console upload)'
        required: true
        default: '1'
      version_name:
        description: 'Android Version Name'
        required: true
        default: '1.1.1'

jobs:
  build-android-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (API 36 & Build-Tools 35/36)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0'

      - name: Configure Bubblewrap SDK & JDK Paths
        id: android_sdk
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: $SDK_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_ROOT" 2>/dev/null || true

          # Bubblewrap's AndroidSdkTools.validatePath requires <sdkPath>/tools or <sdkPath>/bin.
          if [ ! -e "$SDK_ROOT/bin" ] && [ ! -e "$SDK_ROOT/tools" ]; then
            CMDLINE_BIN=""
            for candidate in \
              "$SDK_ROOT/cmdline-tools/latest/bin" \
              "$SDK_ROOT"/cmdline-tools/*/bin; do
              if [ -d "$candidate" ]; then
                CMDLINE_BIN="$candidate"
                break
              fi
            done
            if [ -n "$CMDLINE_BIN" ]; then
              ln -s "$CMDLINE_BIN" "$SDK_ROOT/bin" 2>/dev/null || sudo ln -s "$CMDLINE_BIN" "$SDK_ROOT/bin"
            fi
          fi

          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME:-}",
            "androidSdkPath": "$SDK_ROOT"
          }
          EOF

          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Keystore (Secrets or New Upload Key)
        id: keystore
        working-directory: android-twa
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            STORE_PASS="${KEYSTORE_PASSWORD:-}"
            KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
            echo "$KEYSTORE_BASE64" | base64 -d > hsp-delivery-release.keystore
            if [ -n "${KEY_ALIAS_SECRET:-}" ]; then
              KEY_ALIAS="$KEY_ALIAS_SECRET"
            else
              # Auto-detect the first PrivateKeyEntry alias inside the uploaded keystore
              KEY_ALIAS="$(keytool -list -keystore hsp-delivery-release.keystore -storepass "$STORE_PASS" | awk -F',' '/PrivateKeyEntry/ { print $1; exit }')"
              KEY_ALIAS="${KEY_ALIAS:-hspdelivery}"
            fi
          else
            STORE_PASS="HspDelivery2026!"
            KEY_PASS="$STORE_PASS"
            KEY_ALIAS="hspdelivery"
            rm -f hsp-delivery-release.keystore
            keytool -genkeypair -v \
              -keystore hsp-delivery-release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=HSP delivery, OU=Operations, O=HSP delivery, L=Hasilpur, S=Punjab, C=PK"
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"

          # Export PEM certificate (needed if resetting your upload key in Google Play Console)
          keytool -export -rfc \
            -keystore hsp-delivery-release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASS" \
            -file upload_certificate.pem

          KEYTOOL_OUT="$(keytool -list -v -keystore hsp-delivery-release.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASS")"
          SHA1="$(awk '/SHA1:/ { print $2; exit }' <<< "$KEYTOOL_OUT")"
          SHA256="$(awk '/SHA256:/ { print $2; exit }' <<< "$KEYTOOL_OUT")"
          if [ -z "$SHA256" ]; then
            echo "ERROR: Could not extract SHA-256 fingerprint from keystore (alias: $KEY_ALIAS)"
            exit 1
          fi
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Key Alias:         $KEY_ALIAS"
          echo "Upload Key SHA-1:  $SHA1"
          echo "Upload Key SHA-256: $SHA256"

      - name: Update twa-manifest.json with Workflow Inputs
        working-directory: android-twa
        env:
          INPUT_URL: ${{ github.event.inputs.app_url }}
          INPUT_PKG: ${{ github.event.inputs.package_id }}
          INPUT_VCODE: ${{ github.event.inputs.version_code }}
          INPUT_VNAME: ${{ github.event.inputs.version_name }}
        run: |
          node -e '
            const fs = require("fs");
            const sanitize = (s) => typeof s === "string" ? s.replace(/\s*&\s*/g, " and ").replace(/\u2014/g, "-") : s;
            const cleanUrl = process.env.INPUT_URL.replace(/\/+$/, "");
            const host = new URL(cleanUrl).host;
            const vName = process.env.INPUT_VNAME || "1.1.1";
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.packageId = process.env.INPUT_PKG;
            m.host = host;
            m.name = sanitize(m.name);
            m.launcherName = sanitize(m.launcherName);
            m.iconUrl = cleanUrl + "/pwa-512x512.png";
            m.maskableIconUrl = cleanUrl + "/pwa-maskable-512x512.png";
            m.webManifestUrl = cleanUrl + "/manifest.webmanifest";
            m.fullScopeUrl = cleanUrl + "/";
            m.appVersionCode = Number(process.env.INPUT_VCODE) || 1;
            m.appVersion = vName;
            m.appVersionName = vName;
            m.minSdkVersion = Math.max(Number(m.minSdkVersion) || 24, 24);
            m.shortcuts = (m.shortcuts || []).map((s) => ({
              ...s,
              name: sanitize(s.name),
              shortName: sanitize(s.shortName),
              url: cleanUrl + new URL(s.url).pathname + new URL(s.url).search,
              chosenIconUrl: cleanUrl + "/pwa-192x192.png",
            }));
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '

      - name: Generate Android Gradle Project from twa-manifest.json
        working-directory: android-twa
        run: |
          node ./run-bubblewrap.mjs --update-only

      - name: Build Signed Android Bundle (.aab) & APK (.apk) with Gradle
        working-directory: android-twa
        shell: bash
        env:
          SDK_ROOT: ${{ steps.android_sdk.outputs.sdk_root }}
          HSP_STORE_PASS: ${{ steps.keystore.outputs.store_pass }}
          HSP_KEY_PASS: ${{ steps.keystore.outputs.key_pass }}
          HSP_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
        run: |
          echo "sdk.dir=$SDK_ROOT" > local.properties
          chmod +x ./gradlew

          GRADLE_EXIT=0
          ./gradlew bundleRelease assembleRelease --no-daemon > gradle-build.log 2>&1 || GRADLE_EXIT=$?
          cat gradle-build.log
          if [ "$GRADLE_EXIT" -ne 0 ]; then
            ERR_BLOCK="$(awk '/^\* What went wrong:/{flag=1; next} /^\* Try:/{flag=0} flag && NF {print}' gradle-build.log | tr '\n' ' ' | cut -c1-500)"
            if [ -z "$ERR_BLOCK" ]; then
              ERR_BLOCK="$(awk '/Execution failed for task|AAPT:|error:|Caused by:/ { print; count++; if (count >= 5) exit }' gradle-build.log | tr '\n' ' ' | cut -c1-500)"
            fi
            echo "::error title=Gradle Build Failed::${ERR_BLOCK:-Check gradle-build.log}"
            echo "### Gradle Build Failure (last 40 lines)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$GRADLE_EXIT"
          fi

      - name: Verify & Package Signed .AAB and .APK
        working-directory: android-twa
        shell: bash
        run: |
          RAW_AAB="app/build/outputs/bundle/release/app-release.aab"
          RAW_APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$RAW_AAB" ]; then
            echo "ERROR: Expected signed AAB not found at $RAW_AAB"
            ls -la app/build/outputs/bundle/release/ || true
            exit 1
          fi
          if [ ! -f "$RAW_APK" ]; then
            echo "ERROR: Expected signed APK not found at $RAW_APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          cp "$RAW_AAB" app-release-bundle.aab
          cp "$RAW_APK" app-release-signed.apk

          jarsigner -verify app-release-bundle.aab
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify app-release-signed.apk
          fi
          ls -lh app-release-bundle.aab app-release-signed.apk

      - name: Generate Matching assetlinks.json
        working-directory: android-twa
        env:
          INPUT_PKG: ${{ github.event.inputs.package_id }}
          SHA256: ${{ steps.keystore.outputs.sha256 }}
        run: |
          cat <<EOF > assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "$INPUT_PKG",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]
          EOF

      - name: Upload Play Console .AAB, Test .APK & assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: hsp-delivery-android-release
          path: |
            android-twa/app-release-bundle.aab
            android-twa/app-release-signed.apk
            android-twa/assetlinks.json
            android-twa/hsp-delivery-release.keystore
            android-twa/upload_certificate.pem
          retention-days: 30
