name: Build HSP delivery Android AAB & APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Public HTTPS URL of HSP delivery (must serve /manifest.webmanifest)'
        required: true
        default: 'https://ais-pre-jjyvyo7m4unbdm4dz4upjq-756142993760.asia-southeast1.run.app'
      package_id:
        description: 'Android Package Name (Application ID)'
        required: true
        default: 'com.hspdelivery.app'
      version_code:
        description: 'Android Version Code (increment for every Play Console upload)'
        required: true
        default: '1'
      version_name:
        description: 'Android Version Name'
        required: true
        default: '1.0.0'

jobs:
  build-android-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK (API 36, Build-Tools 36.1.0 & Bubblewrap Compatibility)
        id: android_sdk
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found at $SDK_ROOT"
            exit 1
          fi

          # Locate sdkmanager inside modern cmdline-tools or legacy tools layout
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found inside $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using Android SDK: $SDK_ROOT"
          echo "Using sdkmanager:  $SDKMANAGER"

          # Bubblewrap's AndroidSdkTools.validatePath requires <sdkPath>/tools or <sdkPath>/bin.
          # Modern GitHub Actions runners use cmdline-tools/latest/bin instead, so add a bin symlink.
          if [ ! -e "$SDK_ROOT/bin" ] && [ ! -e "$SDK_ROOT/tools" ]; then
            ln -s "$SDKMANAGER_DIR" "$SDK_ROOT/bin" 2>/dev/null || sudo ln -s "$SDKMANAGER_DIR" "$SDK_ROOT/bin"
          fi

          # Accept SDK licenses and install exact platform + build-tools required by Gradle & Bubblewrap
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.1.0"

          # Write Bubblewrap config with verified JDK and SDK paths
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_ROOT"
          }
          EOF

          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Prepare Release Keystore (Secrets or New Upload Key)
        id: keystore
        working-directory: android-twa
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "$KEYSTORE_BASE64" | base64 -d > hsp-delivery-release.keystore
          else
            STORE_PASS="HspDelivery2026!"
            KEY_PASS="$STORE_PASS"
            rm -f hsp-delivery-release.keystore
            keytool -genkeypair -v \
              -keystore hsp-delivery-release.keystore \
              -alias hspdelivery \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=HSP delivery, OU=Operations, O=HSP delivery, L=Hasilpur, S=Punjab, C=PK"
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"

          SHA256=$(keytool -list -v -keystore hsp-delivery-release.keystore -alias hspdelivery -storepass "$STORE_PASS" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Upload Key SHA-256: $SHA256"

      - name: Update twa-manifest.json with Workflow Inputs
        working-directory: android-twa
        env:
          INPUT_URL: ${{ github.event.inputs.app_url }}
          INPUT_PKG: ${{ github.event.inputs.package_id }}
          INPUT_VCODE: ${{ github.event.inputs.version_code }}
          INPUT_VNAME: ${{ github.event.inputs.version_name }}
        run: |
          node -e '
            const fs = require("fs");
            const cleanUrl = process.env.INPUT_URL.replace(/\/+$/, "");
            const host = new URL(cleanUrl).host;
            const vName = process.env.INPUT_VNAME || "1.0.0";
            const m = JSON.parse(fs.readFileSync("twa-manifest.json", "utf8"));
            m.packageId = process.env.INPUT_PKG;
            m.host = host;
            m.iconUrl = cleanUrl + "/pwa-512x512.png";
            m.maskableIconUrl = cleanUrl + "/pwa-maskable-512x512.png";
            m.webManifestUrl = cleanUrl + "/manifest.webmanifest";
            m.fullScopeUrl = cleanUrl + "/";
            m.appVersionCode = Number(process.env.INPUT_VCODE) || 1;
            m.appVersion = vName;
            m.appVersionName = vName;
            m.shortcuts = (m.shortcuts || []).map((s) => ({
              ...s,
              url: cleanUrl + new URL(s.url).pathname + new URL(s.url).search,
              chosenIconUrl: cleanUrl + "/pwa-192x192.png",
            }));
            fs.writeFileSync("twa-manifest.json", JSON.stringify(m, null, 2));
          '

      - name: Generate Android Gradle Project from twa-manifest.json
        working-directory: android-twa
        run: |
          node ./run-bubblewrap.mjs --update-only

      - name: Compile & Sign Android App Bundle (.aab) and APK (.apk)
        working-directory: android-twa
        env:
          SDK_ROOT: ${{ steps.android_sdk.outputs.sdk_root }}
          STORE_PASS: ${{ steps.keystore.outputs.store_pass }}
          KEY_PASS: ${{ steps.keystore.outputs.key_pass }}
        run: |
          set -euo pipefail
          echo "sdk.dir=$SDK_ROOT" > local.properties
          chmod +x ./gradlew

          # Build both release Android App Bundle (.aab) and release APK (.apk)
          ./gradlew bundleRelease assembleRelease --no-daemon

          # Sign the Play Console Android App Bundle (.aab) with jarsigner
          RAW_AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$RAW_AAB" ]; then
            echo "Expected AAB not found at $RAW_AAB"
            exit 1
          fi
          cp "$RAW_AAB" app-release-bundle.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore hsp-delivery-release.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            app-release-bundle.aab \
            hspdelivery
          jarsigner -verify app-release-bundle.aab

          # Zipalign and sign the direct-install Android APK (.apk) with apksigner
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/36.1.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n 1)"
          fi

          RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$RAW_APK" ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          fi
          if [ ! -f "$RAW_APK" ]; then
            echo "Expected APK not found under app/build/outputs/apk/release/"
            exit 1
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks hsp-delivery-release.keystore \
            --ks-key-alias hspdelivery \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out app-release-signed.apk \
            app-release-aligned.apk
          "$BUILD_TOOLS_DIR/apksigner" verify app-release-signed.apk
          rm -f app-release-aligned.apk

          ls -lh app-release-bundle.aab app-release-signed.apk

      - name: Generate Matching assetlinks.json
        working-directory: android-twa
        env:
          INPUT_PKG: ${{ github.event.inputs.package_id }}
          SHA256: ${{ steps.keystore.outputs.sha256 }}
        run: |
          cat <<EOF > assetlinks.json
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "$INPUT_PKG",
                "sha256_cert_fingerprints": ["$SHA256"]
              }
            }
          ]
          EOF

      - name: Upload Play Console .AAB, Test .APK & assetlinks.json
        uses: actions/upload-artifact@v4
        with:
          name: hsp-delivery-android-release
          path: |
            android-twa/app-release-bundle.aab
            android-twa/app-release-signed.apk
            android-twa/assetlinks.json
            android-twa/hsp-delivery-release.keystore
          retention-days: 30
